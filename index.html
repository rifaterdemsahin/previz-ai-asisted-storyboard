<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Claude Code Certificate — AI Storyboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f172a;
            --bg-elevated: #1e293b;
            --bg-card: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--bg-elevated) 0%, var(--bg) 100%);
            border-bottom: 1px solid var(--bg-card);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }
        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .header-actions a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--bg-card);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .header-actions a:hover {
            color: var(--text);
            border-color: var(--accent);
            background: var(--bg);
        }
        .header-actions a svg {
            width: 16px;
            height: 16px;
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
            background: var(--bg);
            padding: 0.3rem;
            border-radius: var(--radius);
            border: 1px solid var(--bg-card);
        }
        .view-toggle button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .view-toggle button.active {
            background: var(--accent);
            color: var(--bg);
        }
        .view-toggle button:hover:not(.active) {
            color: var(--text);
        }

        /* Main */
        main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Generate Panel */
        .generate-panel {
            background: var(--bg-elevated);
            border: 1px solid var(--bg-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .generate-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .generate-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .generate-row button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .generate-row button:hover { filter: brightness(1.1); }
        .generate-row button:disabled { opacity: 0.5; cursor: not-allowed; }
        .generate-row button.secondary {
            background: var(--bg-card);
            color: var(--text);
        }
        .status-bar {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }
        .status-bar.active { display: block; }
        .status-bar.info { background: rgba(56,189,248,0.1); border: 1px solid var(--accent); color: var(--accent); }
        .status-bar.success { background: rgba(34,197,94,0.1); border: 1px solid var(--success); color: var(--success); }
        .status-bar.error { background: rgba(239,68,68,0.1); border: 1px solid var(--danger); color: var(--danger); }
        .status-bar code {
            background: rgba(255,255,255,0.08);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-family: "SF Mono", Monaco, monospace;
            font-size: 0.8em;
        }

        /* Carousel */
        .carousel-container { display: none; }
        .carousel-container.active { display: block; }
        .carousel-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .carousel-image-wrapper {
            flex: 1;
            max-width: 900px;
            aspect-ratio: 1;
            background: var(--bg-elevated);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--bg-card);
            position: relative;
        }
        .carousel-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .carousel-image-wrapper .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 1rem;
        }
        .carousel-image-wrapper .placeholder svg {
            width: 80px;
            height: 80px;
            opacity: 0.4;
        }
        .carousel-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--bg-card);
            color: var(--text);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .carousel-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
        .carousel-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .chapter-info {
            background: var(--bg-elevated);
            border-radius: var(--radius);
            padding: 1.5rem 2rem;
            border: 1px solid var(--bg-card);
            max-width: 900px;
            margin: 0 auto;
        }
        .chapter-info .chapter-num {
            display: inline-block;
            background: var(--accent);
            color: var(--bg);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
        .chapter-info h2 { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .chapter-info .setting { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
        .chapter-info .story-text { font-size: 1rem; line-height: 1.7; color: var(--text); margin-bottom: 1rem; }
        .chapter-info .prompt { font-size: 0.8rem; color: var(--text-muted); border-left: 3px solid var(--accent); padding-left: 0.8rem; font-style: italic; }
        .chapter-info .prompt-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 0.3rem; }

        .carousel-dots { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.5rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bg-card); cursor: pointer; transition: all 0.2s; }
        .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

        /* Storyboard */
        .storyboard-container { display: none; }
        .storyboard-container.active { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .story-card {
            background: var(--bg-elevated);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--bg-card);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .story-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--accent); }
        .story-card .card-image { aspect-ratio: 1; background: var(--bg); position: relative; overflow: hidden; }
        .story-card .card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .story-card .card-image .placeholder {
            width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 0.5rem;
        }
        .story-card .card-image .placeholder svg { width: 48px; height: 48px; opacity: 0.3; }
        .story-card .card-body { padding: 1rem; }
        .story-card .card-chapter { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem; }
        .story-card h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
        .story-card .card-setting { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .story-card .card-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .generate-badge { position: absolute; top: 0.75rem; right: 0.75rem; background: var(--warning); color: var(--bg); font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; }
        .generated-badge { position: absolute; top: 0.75rem; right: 0.75rem; background: var(--success); color: var(--bg); font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; }
        .generating-badge { position: absolute; top: 0.75rem; right: 0.75rem; background: var(--accent); color: var(--bg); font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 2rem; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-elevated); border-radius: var(--radius); max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid var(--bg-card); box-shadow: var(--shadow); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--bg-card); }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.2s; }
        .modal-close:hover { background: var(--bg-card); color: var(--text); }
        .modal-image { width: 100%; aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; }
        .modal-image img { width: 100%; height: 100%; object-fit: cover; }
        .modal-body { padding: 1.5rem; }
        .modal-body .modal-story { font-size: 0.95rem; line-height: 1.7; color: var(--text); margin-bottom: 1rem; }
        .modal-body .modal-prompt-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 0.3rem; }
        .modal-body .modal-prompt { font-size: 0.85rem; color: var(--text-muted); font-style: italic; border-left: 3px solid var(--accent); padding-left: 0.75rem; }

        /* Footer */
        footer {
            background: var(--bg-elevated);
            border-top: 1px solid var(--bg-card);
            padding: 1.5rem 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }
        footer a:hover { color: var(--text); }
        footer .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }
        footer .footer-links a {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        footer svg { width: 16px; height: 16px; }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 1rem; }
            main { padding: 1rem; }
            .carousel-stage { flex-direction: column; }
            .carousel-btn { width: 40px; height: 40px; }
            .carousel-image-wrapper { max-width: 100%; }
            .storyboard-container.active { grid-template-columns: 1fr; }
            .chapter-info { padding: 1rem; }
            .header-actions { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="logo">The Claude Code Certificate</div>
            <div class="subtitle">AI-Assisted Storyboard Generator &middot; 9 Chapters</div>
        </div>
        <div class="header-actions">
            <a href="https://github.com/rifaterdemsahin/previz-ai-asisted-storyboard/edit/main/data/story.json" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Edit Story
            </a>
            <div class="view-toggle">
                <button id="btn-carousel" class="active" onclick="showView('carousel')">Carousel</button>
                <button id="btn-storyboard" onclick="showView('storyboard')">Storyboard</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Generate Panel -->
        <div class="generate-panel">
            <h3>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                Generate Images
            </h3>
            <div class="generate-row">
                <button id="runAllBtn" onclick="runBatch()">Generate All Chapters</button>
                <button id="runOneBtn" onclick="runSingle()">Generate Current Chapter</button>
                <button id="pollBtn" class="secondary" onclick="resumePolling()" style="display:none">Resume Polling</button>
            </div>
            <div id="statusBar" class="status-bar"></div>
        </div>

        <!-- Carousel View -->
        <div id="carousel-view" class="carousel-container active">
            <div class="carousel-stage">
                <button class="carousel-btn" id="prevBtn" onclick="prevChapter()" aria-label="Previous">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <div class="carousel-image-wrapper" id="carouselImage">
                    <div class="placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        <p>Loading story...</p>
                    </div>
                </div>
                <button class="carousel-btn" id="nextBtn" onclick="nextChapter()" aria-label="Next">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
            <div class="chapter-info" id="chapterInfo">
                <span class="chapter-num">Chapter 1</span>
                <h2 id="infoTitle">Loading...</h2>
                <div class="setting" id="infoSetting">...</div>
                <p class="story-text" id="infoText">...</p>
                <div>
                    <div class="prompt-label">Image Prompt</div>
                    <div class="prompt" id="infoPrompt">...</div>
                </div>
            </div>
            <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <!-- Storyboard View -->
        <div id="storyboard-view" class="storyboard-container"></div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">Chapter</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-image" id="modalImage"></div>
            <div class="modal-body">
                <div class="setting" id="modalSetting"></div>
                <p class="modal-story" id="modalText"></p>
                <div class="modal-prompt-label">Image Prompt</div>
                <div class="modal-prompt" id="modalPrompt"></div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="https://github.com/rifaterdemsahin/previz-ai-asisted-storyboard" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                GitHub Repository
            </a>
            <a href="https://github.com/rifaterdemsahin/previz-ai-asisted-storyboard/edit/main/data/story.json" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Edit Story JSON
            </a>
            <a href="https://rifaterdemsahin.github.io/previz-ai-asisted-storyboard/" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                Live Demo
            </a>
        </div>
        <div>Built with RunPod Serverless &middot; Stable Diffusion XL &middot; FastAPI</div>
    </footer>

    <script>
        const API_BASE = window.location.origin;
        let chapters = [];
        let currentChapter = 0;
        let activeJobs = [];

        // Load story from backend
        async function loadStory() {
            try {
                const resp = await fetch(`${API_BASE}/story`);
                const data = await resp.json();
                chapters = data.chapters.map((ch, i) => ({
                    num: ch.chapter || i + 1,
                    title: ch.title,
                    setting: ch.setting,
                    text: ch.text,
                    prompt: ch.image_prompt,
                    file: `txt2img_ch${String(i + 1).padStart(2, '0')}_${ch.title.toLowerCase().replace(/\s+/g, '_').replace(/'/g, '')}.png`
                }));
                renderCarousel();
                renderStoryboard();
            } catch (err) {
                console.error('Failed to load story:', err);
                document.getElementById('infoText').textContent = 'Failed to load story.json. Ensure the backend is running.';
            }
        }

        // Cookie helpers
        function setCookie(name, value, days=7) {
            const d = new Date();
            d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/`;
        }
        function getCookie(name) {
            const v = document.cookie.split(';').find(c => c.trim().startsWith(name + '='));
            return v ? decodeURIComponent(v.split('=')[1]) : '';
        }
        function eraseCookie(name) { setCookie(name, '', -1); }

        function setStatus(msg, type='info') {
            const bar = document.getElementById('statusBar');
            bar.className = 'status-bar active ' + type;
            bar.innerHTML = msg;
        }
        function clearStatus() {
            document.getElementById('statusBar').className = 'status-bar';
        }

        // Generation
        async function runBatch() {
            document.getElementById('runAllBtn').disabled = true;
            document.getElementById('runOneBtn').disabled = true;
            setStatus('Starting batch generation for all chapters...', 'info');

            for (let i = 0; i < chapters.length; i++) {
                await generateChapter(i);
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        async function runSingle() {
            document.getElementById('runAllBtn').disabled = true;
            document.getElementById('runOneBtn').disabled = true;
            await generateChapter(currentChapter);
        }

        async function generateChapter(index) {
            const ch = chapters[index];
            try {
                setStatus(`Chapter ${ch.num}: Submitting "${ch.title}"...`, 'info');
                const resp = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: ch.prompt, filename: ch.file })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail || 'Generate failed');

                activeJobs.push({ jobId: data.job_id, filename: ch.file, chapter: index });
                setCookie('active_jobs', JSON.stringify(activeJobs));
                setStatus(`Chapter ${ch.num}: Job <code>${data.job_id}</code> queued.`, 'info');

                pollJob(data.job_id, ch.file, index);
            } catch (err) {
                setStatus(`Chapter ${ch.num} error: ${err.message}`, 'error');
                document.getElementById('runAllBtn').disabled = false;
                document.getElementById('runOneBtn').disabled = false;
            }
        }

        function pollJob(jobId, filename, chapterIndex) {
            const check = async () => {
                try {
                    const resp = await fetch(`${API_BASE}/status/${jobId}`);
                    const data = await resp.json();
                    const state = data.status || 'UNKNOWN';

                    if (state === 'COMPLETED') {
                        setStatus(`Chapter ${chapterIndex + 1}: <strong>${filename}</strong> completed and saved!`, 'success');
                        removeJob(jobId);
                        refreshImages();
                        document.getElementById('runAllBtn').disabled = false;
                        document.getElementById('runOneBtn').disabled = false;
                        return;
                    }
                    if (['FAILED', 'CANCELLED', 'TIMED_OUT'].includes(state)) {
                        setStatus(`Chapter ${chapterIndex + 1} failed: <strong>${state}</strong>`, 'error');
                        removeJob(jobId);
                        document.getElementById('runAllBtn').disabled = false;
                        document.getElementById('runOneBtn').disabled = false;
                        return;
                    }
                    setStatus(`Chapter ${chapterIndex + 1}: <code>${jobId}</code> status <strong>${state}</strong> (polling...)`, 'info');
                    setTimeout(check, 10000);
                } catch (err) {
                    setStatus(`Polling error: ${err.message}. Click Resume to retry.`, 'warning');
                    document.getElementById('pollBtn').style.display = 'inline-block';
                    document.getElementById('runAllBtn').disabled = false;
                    document.getElementById('runOneBtn').disabled = false;
                }
            };
            check();
        }

        function removeJob(jobId) {
            activeJobs = activeJobs.filter(j => j.jobId !== jobId);
            setCookie('active_jobs', JSON.stringify(activeJobs));
        }

        function resumePolling() {
            const saved = getCookie('active_jobs');
            if (!saved) { setStatus('No saved jobs to resume.', 'warning'); return; }
            try {
                activeJobs = JSON.parse(saved);
                activeJobs.forEach(j => pollJob(j.jobId, j.filename, j.chapter));
                document.getElementById('pollBtn').style.display = 'none';
            } catch (e) {
                setStatus('Could not resume jobs.', 'error');
            }
        }

        function refreshImages() {
            renderCarousel();
            renderStoryboard();
        }

        // View switching
        function showView(view) {
            document.getElementById('carousel-view').classList.toggle('active', view === 'carousel');
            document.getElementById('storyboard-view').classList.toggle('active', view === 'storyboard');
            document.getElementById('btn-carousel').classList.toggle('active', view === 'carousel');
            document.getElementById('btn-storyboard').classList.toggle('active', view === 'storyboard');
        }

        // Carousel
        function renderCarousel() {
            if (!chapters.length) return;
            const ch = chapters[currentChapter];
            const imgPath = `${API_BASE}/images/${ch.file}`;

            const imgWrapper = document.getElementById('carouselImage');
            imgWrapper.innerHTML = '';
            const img = new Image();
            img.src = imgPath;
            img.alt = ch.title;
            img.onload = () => { imgWrapper.innerHTML = ''; imgWrapper.appendChild(img); };
            img.onerror = () => {
                imgWrapper.innerHTML = `<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><p>Click "Generate" to create this image</p></div>`;
            };

            document.getElementById('infoTitle').textContent = ch.title;
            document.getElementById('infoSetting').textContent = ch.setting;
            document.getElementById('infoText').textContent = ch.text;
            document.getElementById('infoPrompt').textContent = ch.prompt;
            document.querySelector('.chapter-num').textContent = `Chapter ${ch.num}`;

            document.getElementById('prevBtn').disabled = currentChapter === 0;
            document.getElementById('nextBtn').disabled = currentChapter === chapters.length - 1;

            const dots = document.getElementById('carouselDots');
            dots.innerHTML = '';
            chapters.forEach((_, i) => {
                const d = document.createElement('div');
                d.className = 'dot' + (i === currentChapter ? ' active' : '');
                d.onclick = () => { currentChapter = i; renderCarousel(); };
                dots.appendChild(d);
            });
        }
        function prevChapter() { if (currentChapter > 0) { currentChapter--; renderCarousel(); } }
        function nextChapter() { if (currentChapter < chapters.length - 1) { currentChapter++; renderCarousel(); } }

        // Storyboard
        function renderStoryboard() {
            const container = document.getElementById('storyboard-view');
            container.innerHTML = '';
            chapters.forEach((ch, i) => {
                const imgPath = `${API_BASE}/images/${ch.file}`;
                const card = document.createElement('div');
                card.className = 'story-card';
                card.onclick = () => openModal(i);

                const imgDiv = document.createElement('div');
                imgDiv.className = 'card-image';

                const img = new Image();
                img.src = imgPath;
                img.onload = () => {
                    imgDiv.innerHTML = '';
                    imgDiv.appendChild(img);
                    const badge = document.createElement('span');
                    badge.className = 'generated-badge';
                    badge.textContent = 'Generated';
                    imgDiv.appendChild(badge);
                };
                img.onerror = () => {
                    imgDiv.innerHTML = `<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><p style="font-size:0.75rem">Not yet generated</p></div>`;
                    const badge = document.createElement('span');
                    badge.className = 'generate-badge';
                    badge.textContent = 'Generate';
                    imgDiv.appendChild(badge);
                };

                const body = document.createElement('div');
                body.className = 'card-body';
                body.innerHTML = `
                    <div class="card-chapter">Chapter ${ch.num}</div>
                    <h3>${ch.title}</h3>
                    <div class="card-setting">${ch.setting}</div>
                    <p class="card-text">${ch.text}</p>
                `;

                card.appendChild(imgDiv);
                card.appendChild(body);
                container.appendChild(card);
            });
        }

        // Modal
        function openModal(index) {
            const ch = chapters[index];
            const imgPath = `${API_BASE}/images/${ch.file}`;
            document.getElementById('modalTitle').textContent = `Chapter ${ch.num}: ${ch.title}`;
            document.getElementById('modalSetting').textContent = ch.setting;
            document.getElementById('modalText').textContent = ch.text;
            document.getElementById('modalPrompt').textContent = ch.prompt;

            const imgDiv = document.getElementById('modalImage');
            imgDiv.innerHTML = '';
            const img = new Image();
            img.src = imgPath;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            img.onload = () => { imgDiv.innerHTML = ''; imgDiv.appendChild(img); };
            img.onerror = () => {
                imgDiv.innerHTML = `<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><p>Image not yet generated</p></div>`;
            };
            document.getElementById('modal').classList.add('active');
        }
        function closeModal(e) {
            if (!e || e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        }

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('carousel-view').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') prevChapter();
            if (e.key === 'ArrowRight') nextChapter();
        });

        // Auto-resume
        const savedJobs = getCookie('active_jobs');
        if (savedJobs) {
            try {
                activeJobs = JSON.parse(savedJobs);
                if (activeJobs.length) {
                    document.getElementById('pollBtn').style.display = 'inline-block';
                    setStatus(`Found ${activeJobs.length} saved job(s). Click Resume Polling.`, 'info');
                }
            } catch (e) { eraseCookie('active_jobs'); }
        }

        // Init
        loadStory();
    </script>
</body>
</html>
